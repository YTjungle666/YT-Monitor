name: release

# Push a tag and this builds the three binaries plus the Windows/fnOS packages,
# then publishes them with checksums. Nothing is published unless every build
# step succeeded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - run: cargo test --workspace
      - run: make package
      - run: cargo build --release -p ytmon-agent --target x86_64-pc-windows-gnu
      - name: packages
        run: bash scripts/package-targets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/bin/ytmon-agent
            dist/bin/ytmon-server
            dist/bin/ytmon-dist
            dist/SHA256SUMS
            dist/packages/*.zip
            dist/packages/*.tar.gz
            dist/packages/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --title "$tag" --generate-notes \
            dist/bin/ytmon-agent dist/bin/ytmon-server dist/bin/ytmon-dist \
            dist/SHA256SUMS dist/packages/ytmon-agent-windows-x64.zip \
            dist/packages/ytmon-agent-fnos.tar.gz dist/packages/SHA256SUMS
