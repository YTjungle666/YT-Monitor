name: release

# Push a tag and this builds the three binaries plus the Windows/fnOS packages,
# then publishes them with checksums. Nothing is published unless every build
# step succeeded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - run: cargo test --workspace
      - run: make package
      - run: cargo build --release -p ytmon-agent --target x86_64-pc-windows-gnu
      - name: packages
        run: bash scripts/package-targets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/bin/ytmon-agent
            dist/bin/ytmon-server
            dist/bin/ytmon-dist
            dist/SHA256SUMS
            dist/packages/*.zip
            dist/packages/*.tar.gz
            dist/packages/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # Two checksum files share a basename, and GitHub allows one asset per
          # name, so the package-level one is uploaded under its own name.
          cp dist/packages/SHA256SUMS dist/SHA256SUMS-packages
          files="dist/bin/ytmon-agent dist/bin/ytmon-server dist/bin/ytmon-dist
                 dist/SHA256SUMS dist/SHA256SUMS-packages
                 dist/packages/ytmon-agent-windows-x64.zip
                 dist/packages/ytmon-agent-fnos.tar.gz"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes $files
          fi
      - name: verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
          n=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          test "$n" -eq 7
          # Zero-byte means the upload silently failed; the checksum files are
          # legitimately a few hundred bytes, so size alone proves nothing.
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | select(.size < 1) | .name' | tee /tmp/empty
          test ! -s /tmp/empty
