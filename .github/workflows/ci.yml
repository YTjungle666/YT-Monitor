name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # -D warnings is inherited from RUSTFLAGS; the flag is repeated here so the
      # intent survives someone editing the env block.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # The point of the musl target is a binary that runs on any distro, so the
      # check is "no shared library dependencies" rather than a string match:
      # `file` calls these static-pie, which is not the word "statically linked".
      - name: no dynamic libraries
        run: |
          set -eu
          for b in ytmon-agent ytmon-server ytmon-dist; do
            f="target/x86_64-unknown-linux-musl/release/$b"
            file "$f"
            if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then
              echo "::error::$b links against a shared library"
              readelf -d "$f" | grep NEEDED
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ytmon-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/ytmon-agent
            target/x86_64-unknown-linux-musl/release/ytmon-server
            target/x86_64-unknown-linux-musl/release/ytmon-dist

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo build --release -p ytmon-agent --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: ytmon-windows
          path: target/x86_64-pc-windows-gnu/release/ytmon-agent.exe
